<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Arvella Landscape — Landscape Design service." />
  <title>Landscape Design — Arvella Landscape</title>
  <link rel="icon" type="image/png" sizes="1254x1254" href="favicon-leaf.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#142018;--cream:#f2f0e8;--green:#203a2a;--muted:#687168;--display:"Manrope",sans-serif;--sans:"DM Sans",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--cream);color:var(--ink);font-family:var(--sans)}
    .page{min-height:100vh;padding:32px 6vw 70px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .brand{font:800 18px var(--display);letter-spacing:.12em}
    .back{font-size:14px;border-bottom:1px solid var(--ink);padding-bottom:5px}
    .hero{min-height:72vh;display:flex;align-items:flex-end;padding:10vh 0}
    .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:24px}
    h1{font:700 clamp(64px,12vw,180px)/.86 var(--display);letter-spacing:-.065em;max-width:1100px}
    .intro{border-top:1px solid rgba(20,32,24,.18);padding-top:28px;max-width:560px;font-size:18px;line-height:1.7;color:var(--muted)}
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <div class="brand">ARVELLA</div>
      <a class="back" href="index.html#services">Back ↙</a>
    </div>
    <section class="hero">
      <div>
        <p class="eyebrow">SERVICE / 01</p>
        <h1>Landscape Design</h1>
      </div>
    </section>
    <p class="intro">From concept to planting palette, we translate your space into a landscape with a clear visual identity.</p>
  </main>
</body>
</html>
